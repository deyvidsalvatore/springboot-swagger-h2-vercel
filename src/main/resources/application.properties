spring.application.name=springboot-swagger-h2-vercel

# Na Vercel, o Dockerfile fornece PORT=80. Localmente, Java usa 8080.
server.port=${PORT:8080}

# H2 em memória: os registros desaparecem ao reiniciar a aplicação.
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console H2 desativado por padrão, especialmente na nuvem.
spring.h2.console.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
